[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-literature-report"
version = "0.1.0"
description = "Configurable arXiv daily and weekly literature reports with HTML, JSON, TXT, and research-group tracking."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "arXiv Literature Report contributors"}
]
keywords = ["arxiv", "literature-review", "research", "codex-skill", "weekly-report"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = []

[project.scripts]
arxiv-literature-report = "arxiv_literature_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

